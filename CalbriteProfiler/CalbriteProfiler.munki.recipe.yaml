Description: Imports Calbrite Profiler into Munki (generated by Windmill f/CreateAutoPKG).
Identifier: com.github.marius-baumann.munki.CalbriteProfiler
ParentRecipe: com.github.marius-baumann.download.CalbriteProfiler
Input:
  NAME: CalbriteProfiler
  MUNKI_REPO_SUBDIR: apps/%NAME%
  pkginfo:
    catalogs:
    - testing
    developer: Calbrite
    display_name: Calbrite Profiler
    name: '%NAME%'
    unattended_install: true
MinimumVersion: '2.3'
Process:
- Processor: MunkiImporter
  Arguments:
    pkg_path: '%pathname%'
    repo_subdirectory: '%MUNKI_REPO_SUBDIR%'
