Description: |
  Downloads the latest Azure CLI standalone macOS tarball (arm64) from GitHub.

  The tarball ships Azure CLI with all dependencies but no Python interpreter.
  The launcher needs AZ_PYTHON pointing at the matching Python version.
Identifier: com.github.marius-baumann.download.AzureCLI
Input:
  NAME: AzureCLI
  ARCH: arm64
MinimumVersion: '2.3'
Process:
  - Processor: URLTextSearcher
    Arguments:
      url: https://api.github.com/repos/Azure/azure-cli/releases/latest
      re_pattern: 'azure-cli-([0-9.]+)-macos-%ARCH%\.tar\.gz'
      result_output_var_name: version
  - Processor: URLDownloader
    Arguments:
      url: https://github.com/Azure/azure-cli/releases/download/azure-cli-%version%/azure-cli-%version%-macos-%ARCH%.tar.gz
      filename: '%NAME%-%version%-%ARCH%.tar.gz'
  - Processor: EndOfCheckPhase
